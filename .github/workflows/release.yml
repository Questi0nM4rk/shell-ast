# ============================================================================
#  release — publishes @questi0nm4rk/shell-ast when a v* tag is pushed.
#  Auth is npm trusted publishing (OIDC): no npm token, no secrets. The
#  package's trusted publisher on npmjs.com names this file: release.yml, and
#  is stage-only: the version goes to the npm stage queue, and a maintainer
#  approves it on npmjs.com (2FA) before it is live.
#  prepublishOnly (package.json) runs the full gate before the tarball ships.
# ============================================================================
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version package.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # prepublishOnly runs go test and the WASM build, so Go is needed here.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Matches the go directive in go.mod; see ci.yml.
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@^11.15.0 # npm stage needs npm 11.15.0 or newer

      - name: Stage on npm
        run: npm stage publish --tag beta --access public --provenance
